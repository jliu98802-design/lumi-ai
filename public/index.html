<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>Soul Sync - 你的专属 AI 情感伙伴</title>
    <style>
        /* ============================================================================
         * 样式层 (CSS Layer)
         * 职责：视觉呈现、动画、响应式布局
         * ============================================================================ */
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
            background: #0a0a0f;
            color: #fff;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }
        
        /* 背景动画 */
        .bg-animation {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
        }
        
        .bg-animation::before {
            content: '';
            position: absolute;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle at 20% 50%, rgba(120, 80, 255, 0.15) 0%, transparent 50%),
                        radial-gradient(circle at 80% 80%, rgba(255, 120, 180, 0.15) 0%, transparent 50%),
                        radial-gradient(circle at 40% 20%, rgba(80, 200, 255, 0.15) 0%, transparent 50%);
            animation: bgMove 20s ease-in-out infinite;
        }
        
        @keyframes bgMove {
            0%, 100% { transform: translate(0, 0); }
            50% { transform: translate(-10%, -10%); }
        }
        
        /* 页面容器 */
        .app-container {
            position: relative;
            z-index: 1;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        
        /* 页面切换 */
        .page {
            display: none;
            flex: 1;
            animation: fadeIn 0.3s ease;
        }
        
        .page.active {
            display: flex;
            flex-direction: column;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        /* 顶部导航栏 */
        .header {
            padding: 16px 20px;
            background: rgba(20, 20, 30, 0.8);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: sticky;
            top: 0;
            z-index: 100;
        }
        
        .header-title {
            font-size: 18px;
            font-weight: 600;
        }
        
        .header-btn {
            padding: 8px 16px;
            background: rgba(120, 80, 255, 0.2);
            border: 1px solid rgba(120, 80, 255, 0.3);
            border-radius: 20px;
            color: #fff;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .header-btn:active {
            transform: scale(0.95);
            background: rgba(120, 80, 255, 0.4);
        }
        
        /* 欢迎页 */
        .welcome-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
            text-align: center;
        }
        
        .welcome-logo {
            width: 120px;
            height: 120px;
            margin-bottom: 30px;
            background: linear-gradient(135deg, #7850ff, #ff78b4);
            border-radius: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 48px;
            animation: logoFloat 3s ease-in-out infinite;
        }
        
        @keyframes logoFloat {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }
        
        .welcome-title {
            font-size: 32px;
            font-weight: 700;
            margin-bottom: 12px;
            background: linear-gradient(135deg, #fff, #b8b8b8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        
        .welcome-subtitle {
            font-size: 16px;
            color: rgba(255, 255, 255, 0.6);
            margin-bottom: 40px;
            line-height: 1.6;
        }
        
        .btn-group {
            display: flex;
            gap: 16px;
            width: 100%;
            max-width: 400px;
        }
        
        .btn {
            flex: 1;
            padding: 16px 24px;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .btn-primary {
            background: linear-gradient(135deg, #7850ff, #5030c0);
            color: #fff;
        }
        
        .btn-primary:active {
            transform: scale(0.98);
        }
        
        .btn-secondary {
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        
        .btn-secondary:active {
            background: rgba(255, 255, 255, 0.2);
        }
        
        /* 登录/注册页 */
        .auth-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            padding: 40px 20px;
            max-width: 400px;
            margin: 0 auto;
            width: 100%;
        }
        
        .auth-title {
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 8px;
        }
        
        .auth-subtitle {
            font-size: 14px;
            color: rgba(255, 255, 255, 0.6);
            margin-bottom: 32px;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        .form-label {
            display: block;
            font-size: 14px;
            color: rgba(255, 255, 255, 0.8);
            margin-bottom: 8px;
        }
        
        .form-input {
            width: 100%;
            padding: 14px 16px;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 12px;
            color: #fff;
            font-size: 16px;
            transition: all 0.3s;
        }
        
        .form-input:focus {
            outline: none;
            border-color: #7850ff;
            background: rgba(120, 80, 255, 0.1);
        }
        
        .form-input::placeholder {
            color: rgba(255, 255, 255, 0.4);
        }
        
        .auth-btn {
            width: 100%;
            padding: 16px;
            margin-top: 12px;
        }
        
        .auth-switch {
            text-align: center;
            margin-top: 24px;
            font-size: 14px;
            color: rgba(255, 255, 255, 0.6);
        }
        
        .auth-switch a {
            color: #7850ff;
            text-decoration: none;
            font-weight: 600;
        }
        
        /* 角色选择页 */
        .character-select {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
        }
        
        .character-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 16px;
            margin-top: 20px;
        }
        
        .character-card {
            background: rgba(30, 30, 40, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            padding: 20px;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .character-card:active {
            transform: scale(0.98);
            border-color: #7850ff;
        }
        
        .character-avatar {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
        }
        
        .character-name {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 4px;
        }
        
        .character-desc {
            font-size: 12px;
            color: rgba(255, 255, 255, 0.6);
            line-height: 1.4;
        }
        
        /* 聊天页 */
        .chat-container {
            flex: 1;
            display: flex;
            flex-direction: column;
        }
        
        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
        
        .message {
            max-width: 80%;
            padding: 12px 16px;
            border-radius: 16px;
            animation: messageSlide 0.3s ease;
        }
        
        @keyframes messageSlide {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .message-user {
            align-self: flex-end;
            background: linear-gradient(135deg, #7850ff, #5030c0);
            border-bottom-right-radius: 4px;
        }
        
        .message-ai {
            align-self: flex-start;
            background: rgba(40, 40, 50, 0.8);
            border-bottom-left-radius: 4px;
        }
        
        .message-text {
            font-size: 15px;
            line-height: 1.5;
            word-wrap: break-word;
        }
        
        .typing-indicator {
            align-self: flex-start;
            padding: 12px 16px;
            background: rgba(40, 40, 50, 0.8);
            border-radius: 16px;
            border-bottom-left-radius: 4px;
        }
        
        .typing-dots {
            display: flex;
            gap: 4px;
        }
        
        .typing-dot {
            width: 8px;
            height: 8px;
            background: rgba(255, 255, 255, 0.6);
            border-radius: 50%;
            animation: typingBounce 1.4s infinite;
        }
        
        .typing-dot:nth-child(2) { animation-delay: 0.2s; }
        .typing-dot:nth-child(3) { animation-delay: 0.4s; }
        
        @keyframes typingBounce {
            0%, 60%, 100% { transform: translateY(0); }
            30% { transform: translateY(-8px); }
        }
        
        .chat-input-area {
            padding: 16px 20px;
            background: rgba(20, 20, 30, 0.9);
            backdrop-filter: blur(20px);
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            gap: 12px;
        }
        
        .chat-input {
            flex: 1;
            padding: 12px 16px;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 24px;
            color: #fff;
            font-size: 15px;
            resize: none;
            max-height: 120px;
        }
        
        .chat-input:focus {
            outline: none;
            border-color: #7850ff;
        }
        
        .chat-send-btn {
            width: 44px;
            height: 44px;
            background: linear-gradient(135deg, #7850ff, #5030c0);
            border: none;
            border-radius: 50%;
            color: #fff;
            font-size: 18px;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .chat-send-btn:active {
            transform: scale(0.95);
        }
        
        /* 底部导航 */
        .bottom-nav {
            display: flex;
            background: rgba(20, 20, 30, 0.95);
            backdrop-filter: blur(20px);
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            padding: 8px 0;
        }
        
        .nav-item {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 8px;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .nav-item.active {
            color: #7850ff;
        }
        
        .nav-icon {
            font-size: 24px;
            margin-bottom: 4px;
        }
        
        .nav-label {
            font-size: 11px;
        }
        
        /* 功能页 */
        .feature-page {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
        }
        
        .feature-title {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 20px;
        }
        
        .feature-card {
            background: rgba(30, 30, 40, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 16px;
        }
        
        /* 加载状态 */
        .loading-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 9999;
        }
        
        .loading-overlay.active {
            display: flex;
        }
        
        .loading-spinner {
            width: 40px;
            height: 40px;
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-top-color: #7850ff;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        /* Toast 提示 */
        .toast {
            position: fixed;
            top: 80px;
            left: 50%;
            transform: translateX(-50%) translateY(-100px);
            padding: 12px 24px;
            background: rgba(40, 40, 50, 0.95);
            border-radius: 8px;
            font-size: 14px;
            z-index: 10000;
            transition: transform 0.3s;
        }
        
        .toast.show {
            transform: translateX(-50%) translateY(0);
        }
        
        /* 响应式 */
        @media (max-width: 480px) {
            .welcome-title { font-size: 28px; }
            .character-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <div class="app-container">
        <!-- 背景动画 -->
        <div class="bg-animation"></div>
        
        <!-- 欢迎页 -->
        <div class="page active" id="page-welcome">
            <div class="welcome-content">
                <div class="welcome-logo">🌟</div>
                <h1 class="welcome-title">Soul Sync</h1>
                <p class="welcome-subtitle">你的专属 AI 情感伙伴<br>倾听、陪伴、懂你</p>
                <div class="btn-group">
                    <button class="btn btn-primary" onclick="UI.goToLogin()">开始使用</button>
                    <button class="btn btn-secondary" onclick="UI.goToRegister()">注册账号</button>
                </div>
            </div>
        </div>
        
        <!-- 登录页 -->
        <div class="page" id="page-login">
            <div class="auth-content">
                <h2 class="auth-title">欢迎回来</h2>
                <p class="auth-subtitle">登录你的 Soul Sync 账号</p>
                <form id="login-form" onsubmit="return handleLogin(event)">
                    <div class="form-group">
                        <label class="form-label">用户名</label>
                        <input type="text" class="form-input" id="login-username" placeholder="请输入用户名" required>
                    </div>
                    <div class="form-group">
                        <label class="form-label">密码</label>
                        <input type="password" class="form-input" id="login-password" placeholder="请输入密码" required>
                    </div>
                    <button type="submit" class="btn btn-primary auth-btn">登录</button>
                </form>
                <p class="auth-switch">还没有账号？<a href="#" onclick="UI.goToRegister()">立即注册</a></p>
            </div>
        </div>
        
        <!-- 注册页 -->
        <div class="page" id="page-register">
            <div class="auth-content">
                <h2 class="auth-title">创建账号</h2>
                <p class="auth-subtitle">开启你的 Soul Sync 之旅</p>
                <form id="register-form" onsubmit="return handleRegister(event)">
                    <div class="form-group">
                        <label class="form-label">用户名</label>
                        <input type="text" class="form-input" id="register-username" placeholder="请输入用户名" required>
                    </div>
                    <div class="form-group">
                        <label class="form-label">密码</label>
                        <input type="password" class="form-input" id="register-password" placeholder="请输入密码" required>
                    </div>
                    <div class="form-group">
                        <label class="form-label">确认密码</label>
                        <input type="password" class="form-input" id="register-confirm" placeholder="再次输入密码" required>
                    </div>
                    <button type="submit" class="btn btn-primary auth-btn">注册</button>
                </form>
                <p class="auth-switch">已有账号？<a href="#" onclick="UI.goToLogin()">立即登录</a></p>
            </div>
        </div>
        
        <!-- 角色选择页 -->
        <div class="page" id="page-character-select">
            <div class="header">
                <span class="header-title">选择你的 AI 伙伴</span>
                <button class="header-btn" onclick="UI.handleLogout()">退出</button>
            </div>
            <div class="character-select">
                <p style="color: rgba(255,255,255,0.6); margin-bottom: 8px;">选择一个角色开始对话</p>
                <div class="character-grid" id="character-grid"></div>
            </div>
        </div>
        
        <!-- 聊天页 -->
        <div class="page" id="page-chat">
            <div class="header">
                <button class="header-btn" onclick="UI.backToCharacterSelect()" style="margin-right: 12px;">← 返回</button>
                <span class="header-title" id="chat-character-name">Lumi</span>
                <div style="width: 60px;"></div>
            </div>
            <div class="chat-container">
                <div class="chat-messages" id="chat-messages"></div>
                <div class="chat-input-area">
                    <textarea class="chat-input" id="chat-input" placeholder="说点什么..." rows="1"></textarea>
                    <button class="chat-send-btn" onclick="handleSendMessage()">➤</button>
                </div>
            </div>
        </div>
        
        <!-- 记忆页 -->
        <div class="page" id="page-memory">
            <div class="header">
                <span class="header-title">记忆卡片</span>
                <button class="header-btn" onclick="UI.handleLogout()">退出</button>
            </div>
            <div class="feature-page">
                <h2 class="feature-title">美好回忆</h2>
                <div id="memory-list"></div>
            </div>
        </div>
        
        <!-- 日记页 -->
        <div class="page" id="page-diary">
            <div class="header">
                <span class="header-title">情感日记</span>
                <button class="header-btn" onclick="UI.handleLogout()">退出</button>
            </div>
            <div class="feature-page">
                <h2 class="feature-title">心情记录</h2>
                <div id="diary-list"></div>
            </div>
        </div>
        
        <!-- 设置页 -->
        <div class="page" id="page-settings">
            <div class="header">
                <span class="header-title">设置</span>
                <button class="header-btn" onclick="UI.handleLogout()">退出</button>
            </div>
            <div class="feature-page">
                <h2 class="feature-title">账户设置</h2>
                <div class="feature-card">
                    <p style="color: rgba(255,255,255,0.6);">用户：<span id="settings-username"></span></p>
                    <p style="color: rgba(255,255,255,0.6); margin-top: 8px;">注册时间：<span id="settings-createdAt"></span></p>
                </div>
                <button class="btn btn-secondary" style="width: 100%; margin-top: 16px;" onclick="UI.handleLogout()">退出登录</button>
            </div>
        </div>
        
        <!-- 底部导航 -->
        <div class="bottom-nav" id="bottom-nav" style="display: none;">
            <div class="nav-item active" data-page="chat" onclick="UI.switchTab('chat')">
                <span class="nav-icon">💬</span>
                <span class="nav-label">聊天</span>
            </div>
            <div class="nav-item" data-page="memory" onclick="UI.switchTab('memory')">
                <span class="nav-icon">🧠</span>
                <span class="nav-label">记忆</span>
            </div>
            <div class="nav-item" data-page="diary" onclick="UI.switchTab('diary')">
                <span class="nav-icon">📔</span>
                <span class="nav-label">日记</span>
            </div>
            <div class="nav-item" data-page="settings" onclick="UI.switchTab('settings')">
                <span class="nav-icon">⚙️</span>
                <span class="nav-label">设置</span>
            </div>
        </div>
    </div>
    
    <!-- 加载遮罩 -->
    <div class="loading-overlay" id="loading">
        <div class="loading-spinner"></div>
    </div>
    
    <!-- Toast 提示 -->
    <div class="toast" id="toast"></div>
    
    <script>
    'use strict';
    
    /* ============================================================================
     * 配置层 (Config Layer)
     * 职责：全局常量、配置项、环境设置
     * ============================================================================ */
    const Config = {
        API_BASE: window.location.origin,
        STORAGE_KEYS: {
            TOKEN: 'soulsync_token',
            USER: 'soulsync_user',
            CONVERSATIONS: 'soulsync_conversations'
        },
        CHARACTERS: {
            lumi: { name: 'Lumi', emoji: '✨', color: '#7850ff', desc: '温暖治愈系，善于倾听' },
            nova: { name: 'Nova', emoji: '🌟', color: '#ff78b4', desc: '活泼开朗，充满活力' },
            luna: { name: 'Luna', emoji: '🌙', color: '#50b4ff', desc: '温柔细腻，富有同理心' },
            sol: { name: 'Sol', emoji: '☀️', color: '#ffb450', desc: '阳光积极，给人力量' }
        },
        MAX_RETRIES: 3,
        RETRY_DELAY: 1000,
        REQUEST_TIMEOUT: 30000
    };
    
    /* ============================================================================
     * 工具层 (Utils Layer)
     * 职责：通用工具函数、错误处理、日志系统、iOS 兼容
     * ============================================================================ */
    const Utils = {
        // 日志系统
        log: (...args) => console.log('[SoulSync]', new Date().toISOString(), ...args),
        warn: (...args) => console.warn('[SoulSync]', new Date().toISOString(), ...args),
        error: (...args) => console.error('[SoulSync]', new Date().toISOString(), ...args),
        
        // Toast 提示
        showToast: (message, duration = 2000) => {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), duration);
        },
        
        // 加载状态
        showLoading: () => document.getElementById('loading').classList.add('active'),
        hideLoading: () => document.getElementById('loading').classList.remove('active'),
        
        // iOS Safari 检测
        isIOSSafari: () => {
            const ua = navigator.userAgent;
            return /iPad|iPhone|iPod/.test(ua) && /Safari/.test(ua) && !/CriOS|FxiOS/.test(ua);
        },
        
        // 安全的 localStorage 操作
        storage: {
            get: (key) => {
                try {
                    const value = localStorage.getItem(key);
                    return value ? JSON.parse(value) : null;
                } catch (e) {
                    Utils.warn('localStorage read error:', key, e);
                    return null;
                }
            },
            set: (key, value) => {
                try {
                    localStorage.setItem(key, JSON.stringify(value));
                    Utils.log('localStorage saved:', key);
                } catch (e) {
                    Utils.warn('localStorage write error:', key, e);
                    // iOS 可能在隐私模式下，尝试清除旧数据
                    if (Utils.isIOSSafari()) {
                        try {
                            localStorage.clear();
                            localStorage.setItem(key, JSON.stringify(value));
                        } catch (e2) {
                            Utils.error('localStorage completely failed:', e2);
                        }
                    }
                }
            },
            remove: (key) => {
                try {
                    localStorage.removeItem(key);
                } catch (e) {
                    Utils.warn('localStorage remove error:', key, e);
                }
            }
        },
        
        // 延迟函数
        delay: (ms) => new Promise(resolve => setTimeout(resolve, ms)),
        
        // 格式化日期
        formatDate: (timestamp) => {
            const date = new Date(timestamp);
            return date.toLocaleString('zh-CN', { 
                year: 'numeric', 
                month: '2-digit', 
                day: '2-digit',
                hour: '2-digit',
                minute: '2-digit'
            });
        }
    };
    
    /* ============================================================================
     * API 层 (API Layer)
     * 职责：所有 HTTP 请求的统一封装，统一错误处理，统一响应格式
     * ============================================================================ */
    const API = {
        // 基础请求方法
        async request(method, path, body = null) {
            const url = `${Config.API_BASE}${path}`;
            const token = State.token;
            
            const headers = {
                'Content-Type': 'application/json',
                'Cache-Control': 'no-cache'
            };
            
            if (token) {
                headers['Authorization'] = `Bearer ${token}`;
            }
            
            const options = {
                method,
                headers,
                cache: 'no-store' // 强制不使用缓存
            };
            
            if (body && method !== 'GET') {
                options.body = JSON.stringify(body);
            }
            
            Utils.log(`API ${method} ${path}`, body ? body : '');
            
            try {
                const response = await fetch(url, options);
                
                // 获取响应文本
                const text = await response.text();
                
                Utils.log(`API Response:`, response.status, text.substring(0, 200));
                
                // 解析响应
                let data;
                try {
                    data = JSON.parse(text);
                } catch (e) {
                    Utils.warn('Response is not JSON, treating as text');
                    data = { message: text, raw: true };
                }
                
                // 处理 HTTP 错误
                if (!response.ok) {
                    const errorMsg = data.error || data.message || `HTTP ${response.status}`;
                    Utils.error(`API Error:`, errorMsg);
                    throw new Error(errorMsg);
                }
                
                return data;
            } catch (error) {
                Utils.error(`API request failed:`, error.message);
                
                // 网络错误特殊处理
                if (error.name === 'TypeError' && error.message.includes('fetch')) {
                    throw new Error('网络连接失败，请检查网络');
                }
                
                throw error;
            }
        },
        
        // 带重试的请求
        async requestWithRetry(method, path, body, retries = Config.MAX_RETRIES) {
            for (let i = 0; i < retries; i++) {
                try {
                    return await this.request(method, path, body);
                } catch (error) {
                    if (i === retries - 1) throw error;
                    Utils.warn(`Retry ${i + 1}/${retries} for ${path}`);
                    await Utils.delay(Config.RETRY_DELAY * (i + 1));
                }
            }
        },
        
        // 具体 API 方法
        async login(username, password) {
            return this.request('POST', '/api/auth/login', { username, password });
        },
        
        async register(username, password) {
            return this.request('POST', '/api/auth/register', { username, password });
        },
        
        async chat(characterId, messages) {
            return this.requestWithRetry('POST', '/api/ai/chat', { 
                characterId, 
                messages 
            });
        },
        
        async getProfile() {
            return this.request('GET', '/api/profile');
        },
        
        async getMemories() {
            return this.request('GET', '/api/memory/cards');
        },
        
        async getDiaries() {
            return this.request('GET', '/api/diary');
        }
    };
    
    /* ============================================================================
     * 状态管理层 (State Layer)
     * 职责：全局状态管理，持久化存储
     * ============================================================================ */
    const State = {
        user: null,
        token: null,
        currentCharacter: null,
        conversations: {},
        
        // 初始化状态
        init() {
            Utils.log('State initializing...');
            
            // 从 localStorage 加载
            this.token = Utils.storage.get(Config.STORAGE_KEYS.TOKEN);
            this.user = Utils.storage.get(Config.STORAGE_KEYS.USER);
            this.conversations = Utils.storage.get(Config.STORAGE_KEYS.CONVERSATIONS) || {};
            
            if (this.token && this.user) {
                Utils.log('State loaded from storage:', this.user.username);
                return true;
            }
            
            return false;
        },
        
        // 保存状态
        save() {
            Utils.storage.set(Config.STORAGE_KEYS.TOKEN, this.token);
            Utils.storage.set(Config.STORAGE_KEYS.USER, this.user);
            Utils.storage.set(Config.STORAGE_KEYS.CONVERSATIONS, this.conversations);
        },
        
        // 清除状态
        clear() {
            this.user = null;
            this.token = null;
            this.currentCharacter = null;
            this.conversations = {};
            
            Utils.storage.remove(Config.STORAGE_KEYS.TOKEN);
            Utils.storage.remove(Config.STORAGE_KEYS.USER);
            Utils.storage.remove(Config.STORAGE_KEYS.CONVERSATIONS);
            
            Utils.log('State cleared');
        },
        
        // 设置用户信息
        setUser(user, token) {
            this.user = user;
            this.token = token;
            this.save();
            Utils.log('User set:', user.username);
        },
        
        // 获取对话历史
        getConversation(characterId) {
            return this.conversations[characterId] || [];
        },
        
        // 添加消息到对话
        addMessage(characterId, message) {
            if (!this.conversations[characterId]) {
                this.conversations[characterId] = [];
            }
            this.conversations[characterId].push(message);
            this.save();
        }
    };
    
    /* ============================================================================
     * UI 层 (UI Layer)
     * 职责：DOM 操作、页面切换、用户交互、动画
     * ============================================================================ */
    const UI = {
        // 页面切换
        showPage: (pageId) => {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            const page = document.getElementById(`page-${pageId}`);
            if (page) {
                page.classList.add('active');
                Utils.log('Page switched to:', pageId);
            }
        },
        
        // 导航控制
        showBottomNav: () => {
            document.getElementById('bottom-nav').style.display = 'flex';
        },
        
        hideBottomNav: () => {
            document.getElementById('bottom-nav').style.display = 'none';
        },
        
        // 页面跳转方法
        goToWelcome: () => {
            UI.hideBottomNav();
            UI.showPage('welcome');
        },
        
        goToLogin: () => {
            UI.hideBottomNav();
            UI.showPage('login');
        },
        
        goToRegister: () => {
            UI.hideBottomNav();
            UI.showPage('register');
        },
        
        goToCharacterSelect: () => {
            UI.hideBottomNav();
            UI.renderCharacterGrid();
            UI.showPage('character-select');
        },
        
        goToChat: (characterId) => {
            State.currentCharacter = characterId;
            UI.showBottomNav();
            UI.renderChatHeader();
            UI.renderChatMessages();
            UI.showPage('chat');
            UI.switchTab('chat');
        },
        
        backToCharacterSelect: () => {
            UI.goToCharacterSelect();
        },
        
        // 标签切换
        switchTab: (tab) => {
            document.querySelectorAll('.nav-item').forEach(item => {
                item.classList.toggle('active', item.dataset.page === tab);
            });
            
            if (tab === 'chat') {
                UI.goToChat(State.currentCharacter || 'lumi');
            } else if (tab === 'memory') {
                UI.showPage('memory');
                UI.loadMemories();
            } else if (tab === 'diary') {
                UI.showPage('diary');
                UI.loadDiaries();
            } else if (tab === 'settings') {
                UI.showPage('settings');
                UI.loadSettings();
            }
        },
        
        // 渲染角色选择网格
        renderCharacterGrid: () => {
            const grid = document.getElementById('character-grid');
            grid.innerHTML = '';
            
            Object.entries(Config.CHARACTERS).forEach(([id, char]) => {
                const card = document.createElement('div');
                card.className = 'character-card';
                card.innerHTML = `
                    <div class="character-avatar" style="background: ${char.color}20; color: ${char.color};">
                        ${char.emoji}
                    </div>
                    <div class="character-name">${char.name}</div>
                    <div class="character-desc">${char.desc}</div>
                `;
                card.onclick = () => UI.goToChat(id);
                grid.appendChild(card);
            });
        },
        
        // 渲染聊天头部
        renderChatHeader: () => {
            const char = Config.CHARACTERS[State.currentCharacter];
            if (char) {
                document.getElementById('chat-character-name').textContent = `${char.emoji} ${char.name}`;
            }
        },
        
        // 渲染聊天消息
        renderChatMessages: () => {
            const container = document.getElementById('chat-messages');
            container.innerHTML = '';
            
            const messages = State.getConversation(State.currentCharacter);
            
            if (messages.length === 0) {
                // 显示欢迎消息
                const char = Config.CHARACTERS[State.currentCharacter];
                const welcomeMsg = document.createElement('div');
                welcomeMsg.className = 'message message-ai';
                welcomeMsg.innerHTML = `<div class="message-text">你好呀！我是 ${char.name} ${char.emoji}<br>有什么想和我聊的吗？</div>`;
                container.appendChild(welcomeMsg);
            } else {
                // 渲染历史消息
                messages.forEach(msg => {
                    const msgEl = document.createElement('div');
                    msgEl.className = `message message-${msg.role === 'user' ? 'user' : 'ai'}`;
                    msgEl.innerHTML = `<div class="message-text">${UI.escapeHtml(msg.content)}</div>`;
                    container.appendChild(msgEl);
                });
            }
            
            // 滚动到底部
            container.scrollTop = container.scrollHeight;
        },
        
        // 添加消息到界面
        appendMessage: (role, content) => {
            const container = document.getElementById('chat-messages');
            const msgEl = document.createElement('div');
            msgEl.className = `message message-${role === 'user' ? 'user' : 'ai'}`;
            msgEl.innerHTML = `<div class="message-text">${UI.escapeHtml(content)}</div>`;
            container.appendChild(msgEl);
            container.scrollTop = container.scrollHeight;
        },
        
        // 显示输入状态
        showTyping: () => {
            const container = document.getElementById('chat-messages');
            const typing = document.createElement('div');
            typing.className = 'typing-indicator';
            typing.id = 'typing-indicator';
            typing.innerHTML = `
                <div class="typing-dots">
                    <div class="typing-dot"></div>
                    <div class="typing-dot"></div>
                    <div class="typing-dot"></div>
                </div>
            `;
            container.appendChild(typing);
            container.scrollTop = container.scrollHeight;
        },
        
        hideTyping: () => {
            const typing = document.getElementById('typing-indicator');
            if (typing) typing.remove();
        },
        
        // 加载记忆列表
        loadMemories: async () => {
            const container = document.getElementById('memory-list');
            container.innerHTML = '<p style="color: rgba(255,255,255,0.6);">加载中...</p>';
            
            try {
                const memories = await API.getMemories();
                
                if (!memories || memories.length === 0) {
                    container.innerHTML = '<p style="color: rgba(255,255,255,0.6);">还没有记忆卡片</p>';
                    return;
                }
                
                container.innerHTML = memories.map(m => `
                    <div class="feature-card">
                        <p style="font-size: 14px; margin-bottom: 8px;">${UI.escapeHtml(m.content)}</p>
                        <p style="font-size: 12px; color: rgba(255,255,255,0.4);">${Utils.formatDate(m.createdAt)}</p>
                    </div>
                `).join('');
            } catch (error) {
                Utils.error('Load memories failed:', error);
                container.innerHTML = '<p style="color: rgba(255,100,100,0.8);">加载失败</p>';
            }
        },
        
        // 加载日记列表
        loadDiaries: async () => {
            const container = document.getElementById('diary-list');
            container.innerHTML = '<p style="color: rgba(255,255,255,0.6);">加载中...</p>';
            
            try {
                const diaries = await API.getDiaries();
                
                if (!diaries || diaries.length === 0) {
                    container.innerHTML = '<p style="color: rgba(255,255,255,0.6);">还没有日记</p>';
                    return;
                }
                
                container.innerHTML = diaries.map(d => `
                    <div class="feature-card">
                        <p style="font-size: 16px; margin-bottom: 8px;">${UI.escapeHtml(d.mood)}</p>
                        <p style="font-size: 14px; margin-bottom: 8px;">${UI.escapeHtml(d.content)}</p>
                        <p style="font-size: 12px; color: rgba(255,255,255,0.4);">${Utils.formatDate(d.createdAt)}</p>
                    </div>
                `).join('');
            } catch (error) {
                Utils.error('Load diaries failed:', error);
                container.innerHTML = '<p style="color: rgba(255,100,100,0.8);">加载失败</p>';
            }
        },
        
        // 加载设置页
        loadSettings: () => {
            if (State.user) {
                document.getElementById('settings-username').textContent = State.user.username;
                document.getElementById('settings-createdAt').textContent = 
                    State.user.createdAt ? Utils.formatDate(State.user.createdAt) : '未知';
            }
        },
        
        // 退出登录
        handleLogout: () => {
            State.clear();
            UI.goToWelcome();
            Utils.showToast('已退出登录');
        },
        
        // HTML 转义
        escapeHtml: (text) => {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
    };
    
    /* ============================================================================
     * 事件处理层 (Event Handler Layer)
     * 职责：表单提交、用户操作的具体处理逻辑
     * ============================================================================ */
    
    // 登录处理
    async function handleLogin(event) {
        event.preventDefault();
        
        const username = document.getElementById('login-username').value.trim();
        const password = document.getElementById('login-password').value;
        
        if (!username || !password) {
            Utils.showToast('请填写完整信息');
            return false;
        }
        
        Utils.showLoading();
        
        try {
            const response = await API.login(username, password);
            
            // 统一处理响应格式
            const token = response.token || response.accessToken;
            const user = response.user || { username: response.username || username };
            
            if (!token) {
                throw new Error('登录响应格式错误');
            }
            
            State.setUser(user, token);
            Utils.hideLoading();
            Utils.showToast('登录成功');
            UI.goToCharacterSelect();
        } catch (error) {
            Utils.hideLoading();
            Utils.error('Login failed:', error);
            Utils.showToast(error.message || '登录失败，请重试');
        }
        
        return false;
    }
    
    // 注册处理
    async function handleRegister(event) {
        event.preventDefault();
        
        const username = document.getElementById('register-username').value.trim();
        const password = document.getElementById('register-password').value;
        const confirm = document.getElementById('register-confirm').value;
        
        if (!username || !password || !confirm) {
            Utils.showToast('请填写完整信息');
            return false;
        }
        
        if (password !== confirm) {
            Utils.showToast('两次密码不一致');
            return false;
        }
        
        if (password.length < 6) {
            Utils.showToast('密码至少6位');
            return false;
        }
        
        Utils.showLoading();
        
        try {
            const response = await API.register(username, password);
            
            // 注册成功后自动登录
            const token = response.token || response.accessToken;
            const user = response.user || { username: response.username || username };
            
            if (token) {
                State.setUser(user, token);
                Utils.hideLoading();
                Utils.showToast('注册成功');
                UI.goToCharacterSelect();
            } else {
                Utils.hideLoading();
                Utils.showToast('注册成功，请登录');
                UI.goToLogin();
            }
        } catch (error) {
            Utils.hideLoading();
            Utils.error('Register failed:', error);
            Utils.showToast(error.message || '注册失败，请重试');
        }
        
        return false;
    }
    
    // 发送消息处理
    async function handleSendMessage() {
        const input = document.getElementById('chat-input');
        const message = input.value.trim();
        
        if (!message) return;
        
        // 清空输入框
        input.value = '';
        
        // 显示用户消息
        UI.appendMessage('user', message);
        State.addMessage(State.currentCharacter, { role: 'user', content: message });
        
        // 显示输入状态
        UI.showTyping();
        
        try {
            // 构建对话历史
            const history = State.getConversation(State.currentCharacter);
            
            // 调用 API
            const response = await API.chat(State.currentCharacter, history);
            
            // 隐藏输入状态
            UI.hideTyping();
            
            // 解析 AI 回复 - 统一处理各种可能的响应格式
            let aiReply = '';
            
            if (typeof response === 'string') {
                aiReply = response;
            } else if (response.content) {
                aiReply = response.content;
            } else if (response.reply) {
                aiReply = response.reply;
            } else if (response.message) {
                aiReply = response.message;
            } else if (response.text) {
                aiReply = response.text;
            } else if (response.data && typeof response.data === 'string') {
                aiReply = response.data;
            } else if (response.data && response.data.reply) {
                aiReply = response.data.reply;
            } else if (response.data && response.data.content) {
                aiReply = response.data.content;
            } else if (response.choices && response.choices[0]) {
                aiReply = response.choices[0].message?.content || response.choices[0].text || '';
            } else {
                throw new Error('AI 回复格式无法解析');
            }
            
            if (!aiReply) {
                throw new Error('AI 回复为空');
            }
            
            // 显示 AI 回复
            UI.appendMessage('ai', aiReply);
            State.addMessage(State.currentCharacter, { role: 'assistant', content: aiReply });
            
        } catch (error) {
            UI.hideTyping();
            Utils.error('Chat failed:', error);
            Utils.showToast('发送失败，请重试');
        }
    }
    
    // 输入框事件
    document.getElementById('chat-input').addEventListener('keydown', (e) => {
        if (e.key === 'Enter' && !e.shiftKey) {
            e.preventDefault();
            handleSendMessage();
        }
    });
    
    /* ============================================================================
     * 初始化层 (Init Layer)
     * 职责：应用启动初始化、路由判断
     * ============================================================================ */
    
    (function init() {
        Utils.log('App initializing...');
        
        // iOS Safari 特殊处理
        if (Utils.isIOSSafari()) {
            Utils.log('iOS Safari detected, applying fixes');
            // 禁用某些可能导致问题的特性
            document.body.style.webkitTransform = 'translateZ(0)';
        }
        
        // 初始化状态
        const hasSession = State.init();
        
        if (hasSession) {
            Utils.log('User has session, going to character select');
            UI.goToCharacterSelect();
        } else {
            Utils.log('No session, showing welcome');
            UI.goToWelcome();
        }
        
        Utils.log('App initialized successfully');
    })();
    
    </script>
</body>
</html>
